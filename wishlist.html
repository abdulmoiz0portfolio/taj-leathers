<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — TAJ LEATHERS</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#ffffff}.font-serif{font-family:'Cinzel',serif}</style>
</head>
<body class="text-[#1a1a1a]">
<div id="site-header"></div>

<section class="max-w-7xl mx-auto px-4 sm:px-6 py-14">
  <h1 class="font-serif text-3xl sm:text-4xl text-[#000000] mb-2">Your Wishlist</h1>
  <p class="text-[#525252] mb-10">Saved for later. Tap the heart again to remove.</p>
  <div id="wish-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  <div id="wish-empty" class="hidden text-center py-20">
    <p class="font-serif text-2xl text-[#000000] mb-3">Nothing saved yet</p>
    <p class="text-[#525252] mb-8">Tap the heart on any product to keep it here.</p>
    <a href="leathers.html" class="bg-[#D4AF37] text-black font-semibold px-8 py-3 rounded-full hover:bg-[#B8860B] transition">Browse Leathers</a>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/products.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script>
renderChrome("wishlist");
function renderWish() {
  const ids = getWish();
  const items = ids.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
  document.getElementById("wish-empty").classList.toggle("hidden", items.length > 0);
  document.getElementById("wish-grid").innerHTML = items.map(productCard).join("");
}
// refresh grid whenever a heart is toggled on this page
const _tw = window.toggleWish;
window.toggleWish = function (id) { _tw(id); renderWish(); };
renderWish();
</script>
<!-- Agentation Visual Feedback & Annotation Toolbar -->
<script src="assets/js/agentation-widget.js" defer></script>
</body>
</html>
