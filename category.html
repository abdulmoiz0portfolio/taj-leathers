<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — TAJ LEATHERS</title>
<meta name="description" content="Shop TAJ LEATHERS handcrafted leather goods.">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#ffffff}.font-serif{font-family:'Cinzel',serif}</style>
</head>
<body class="text-[#1a1a1a]">
<div id="site-header"></div>

<section class="max-w-7xl mx-auto px-4 sm:px-6 py-14">
  <h1 id="cat-title" class="font-serif text-3xl sm:text-5xl text-[#000000] mb-2">Shop All</h1>
  <p id="cat-sub" class="text-[#525252] mb-8">Every piece, handcrafted.</p>

  <div class="flex flex-col sm:flex-row gap-4 sm:items-center justify-between mb-8">
    <div id="cat-tabs" class="flex flex-wrap gap-2"></div>
    <select id="sort" class="bg-[#fafafa] border border-black/10 rounded-full px-5 py-2.5 text-sm text-[#262626] focus:outline-none focus:border-[#D4AF37]">
      <option value="featured">Sort: Featured</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
      <option value="discount">Biggest Discount</option>
    </select>
  </div>

  <div id="grid" class="product-carousel grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  <p id="empty" class="hidden text-center text-[#737373] py-20">No products found.</p>
</section>

<div id="site-footer"></div>
<script src="assets/js/products.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const section = SECTIONS[qs.get("section")] ? qs.get("section") : "leathers";
const SEC = SECTIONS[section];
const SEC_CATS = SEC.cats;
let curCat = qs.get("cat") || "all";

function tabBtn(key, label) {
  const on = curCat === key;
  return `<button onclick="setCat('${key}')" class="px-5 py-2.5 rounded-full text-sm font-medium transition ${on ? "bg-[#D4AF37] text-white" : "bg-[#fafafa] border border-black/10 text-[#262626] hover:border-[#D4AF37]"}">${label}</button>`;
}
function renderTabs() {
  document.getElementById("cat-tabs").innerHTML =
    tabBtn("all", "All") +
    Object.entries(SEC_CATS).map(([k, v]) => tabBtn(k, v.name)).join("");
}
function setCat(k) {
  curCat = k;
  history.replaceState(null, "", "category.html?section=" + section + (k === "all" ? "" : "&cat=" + k));
  render();
}
function render() {
  renderTabs();
  const meta = SEC_CATS[curCat];
  document.title = (meta ? meta.name : "Shop All") + " — " + SEC.name;
  document.getElementById("cat-title").textContent = meta ? meta.name : "Shop All";
  document.getElementById("cat-sub").textContent = meta ? meta.tag : SEC.sub;
  renderChrome(section + "-home");

  let list = PRODUCTS.filter(p => p.section === section && (curCat === "all" || p.cat === curCat));
  const sort = document.getElementById("sort").value;
  if (sort === "low") list = [...list].sort((a, b) => a.price - b.price);
  if (sort === "high") list = [...list].sort((a, b) => b.price - a.price);
  if (sort === "discount") list = [...list].sort((a, b) => (1 - b.price / b.oldPrice) - (1 - a.price / a.oldPrice));

  document.getElementById("grid").innerHTML = list.map(productCard).join("");
  document.getElementById("empty").classList.toggle("hidden", list.length > 0);
}
document.getElementById("sort").addEventListener("change", render);
render();
document.addEventListener("taj:catalog-updated", render);
</script>
</body>
</html>
